version: '3.8'

services:

  # 攻击者容器：生成恶意模型，监听反弹 shell
  attacker:
    build: ./attacker
    container_name: vuln1-attacker
    networks:
      vuln1-net:
        ipv4_address: 172.21.0.10
    tty: true
    stdin_open: true

  # 模型服务器：模拟 HuggingFace Hub，对外提供恶意模型下载
  model_server:
    build: ./model_server
    container_name: vuln1-model-server
    networks:
      vuln1-net:
        ipv4_address: 172.21.0.20
    ports:
      - "8081:8080"  # 宿主机 8081 映射到容器 8080，方便调试

  # 受害者容器：模拟数据科学家机器，定时下载并加载模型，触发攻击
  victim:
    build: ./victim
    container_name: vuln1-victim
    networks:
      vuln1-net:
        ipv4_address: 172.21.0.30
    depends_on:
      - model_server
      - attacker

networks:
  vuln1-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24  # 和 vuln5 用不同的子网，避免冲突