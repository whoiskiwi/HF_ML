# Vuln3: CVE-2026-25874 - LeRobot gRPC Pickle RCE
# 漏洞3：CVE-2026-25874 - LeRobot gRPC Pickle反序列化RCE
# 
# 攻击链：
# attacker (172.23.0.10) 
#   -> 发送恶意pickle到 policy_server:50051 (gRPC)
#   -> policy_server (172.23.0.20) RCE执行代码
#   -> 获得SSH密钥，连接到 internal_server (172.23.0.30)
#   -> 读取 /internal/gpu_credentials.json (目标文件)

version: '3.8'

networks:
  vuln3_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24

services:
  # 攻击者容器
  attacker:
    container_name: vuln3_attacker
    build:
      context: .
      dockerfile: Dockerfile.attacker
    networks:
      vuln3_network:
        ipv4_address: 172.23.0.10
    environment:
      - POLICY_SERVER_HOST=172.23.0.20
      - POLICY_SERVER_PORT=50051
      - INTERNAL_SERVER_HOST=172.23.0.30
    volumes:
      - ./scripts/exploit.py:/opt/exploit.py
      - ./scripts/ssh_connect.py:/opt/ssh_connect.py
    stdin_open: true
    tty: true
    command: /bin/bash

  # 漏洞服务容器 - PolicyServer (gRPC)
  policy_server:
    container_name: vuln3_policy_server
    build:
      context: .
      dockerfile: Dockerfile.policy_server
    networks:
      vuln3_network:
        ipv4_address: 172.23.0.20
    ports:
      - "50051:50051"
    environment:
      - HOST=0.0.0.0
      - PORT=50051
    volumes:
      - ./scripts/policy_server.py:/opt/policy_server.py
      - /root/.ssh:/root/.ssh
    command: python3 /opt/policy_server.py

  # 内部服务器 - SSH服务，存放敏感数据
  internal_server:
    container_name: vuln3_internal_server
    build:
      context: .
      dockerfile: Dockerfile.internal_server
    networks:
      vuln3_network:
        ipv4_address: 172.23.0.30
    ports:
      - "2222:22"
    environment:
      - SSH_USER=robot
      - SSH_PASS=robot123
    volumes:
      - ./data/gpu_credentials.json:/internal/gpu_credentials.json
      - ./scripts/setup_ssh.sh:/opt/setup_ssh.sh
    command: /opt/setup_ssh.sh
